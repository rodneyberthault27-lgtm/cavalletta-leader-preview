<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cavalletta Leader | Previa profissional</title>
    <meta
      name="description"
      content="Previa profissional do site Cavalletta Leader com vitrine de scooters e motos eletricas."
    />
    <style>
      :root {
        color-scheme: dark;
        --lime: #b8ff00;
        --red: #ff3d2e;
        --ink: #070806;
        --text: #f7f8f2;
        --muted: #b9c0b1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 74% 18%, rgba(184, 255, 0, 0.22), transparent 28%),
          linear-gradient(135deg, #12140f, var(--ink));
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }

      main {
        width: min(920px, 100%);
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03)),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 22px);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.42);
      }

      span {
        display: inline-flex;
        padding: 8px 13px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 24px 0 18px;
        font-size: clamp(3rem, 8vw, 6.8rem);
        line-height: 0.86;
        letter-spacing: 0;
      }

      p {
        max-width: 680px;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        margin-top: 22px;
        padding: 0 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--lime), #f1ff4a);
        color: var(--ink);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 16px 34px rgba(184, 255, 0, 0.28);
      }

      small {
        display: block;
        margin-top: 20px;
        color: #81897b;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Previa do cliente</span>
      <h1>Cavalletta Leader</h1>
      <p>
        Prévia profissional da Cavalletta Leader com vitrine de scooters e motos elétricas,
        atendimento em São Paulo e contato direto com a loja.
      </p>
      <a href="https://wa.me/5511925141848" target="_blank" rel="noreferrer">Falar com a Cavalletta Leader</a>
      <small>Prévia pública — não é necessário fazer login.</small>
    </main>
  </body>
</html>
